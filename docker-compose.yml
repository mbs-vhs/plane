# Plane on clawd substrate
# - Removed: plane-db (use clawd-postgres), plane-redis (use clawd-redis), plane-minio (option A: no S3)
# - Kept bundled: plane-mq (RabbitMQ — no shared one to reuse)
# - Network: external `clawd` (joins clawd-postgres/clawd-redis directly by service name)

services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
    networks:
      - clawd

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web
    networks:
      - clawd

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web
    networks:
      - clawd

  api:
    container_name: api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-mq
    networks:
      - clawd

  worker:
    container_name: bgworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-mq
    networks:
      - clawd

  beat-worker:
    container_name: beatworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-mq
    networks:
      - clawd

  migrator:
    container_name: plane-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-mq
    networks:
      - clawd

  live:
    container_name: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - ./apps/api/.env
    networks:
      - clawd

  plane-mq:
    container_name: plane-mq
    # Bumped 2026-06-03 (version audit): 3.13.7 = FINAL 3.13.x build (line is
    # community-EOL since 2024-09). The 4.x migration is a separate planned
    # card — prereqs: enable all 3.13 stable feature flags, migrate any classic
    # mirrored queues to quorum, and NEVER enable khepri_db on 3.13 (blocks
    # in-place 4.x upgrade).
    image: rabbitmq:3.13.7-management-alpine
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - clawd

  plane-minio:
    container_name: plane-minio
    # Pinned 2026-06-03 (version audit): bare `minio/minio` = floating :latest.
    # Docker Hub's terminal community tag IS this 2025-09-07 build (the
    # 2025-10-15 final release with the GHSA-jjjj-jwhf-8rgr service-account/STS
    # privesc fix was never published as an image — upstream archived 2026-04).
    # Exploitability here ≈ nil: loopback/compose-network only, single root
    # credential, no STS/service accounts. Replacement (MinIO→Garage) is a
    # planned card; do NOT expect further upstream patches.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    networks:
      - clawd

  proxy:
    container_name: proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports:
      # Fail-closed bind: Tailscale-only posture per CONTEXT.md; operator sets LISTEN_BIND_IP=<tailscale-ip> in .env.
      - "${LISTEN_BIND_IP:-127.0.0.1}:${LISTEN_HTTP_PORT}:80"
    environment:
      SITE_ADDRESS: ":80"
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      # No upstream proxy in this topology; loopback-only fail-closed default. Operator can override via .env if a real upstream is added.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    depends_on:
      - web
      - api
      - space
      - admin
      - plane-minio
    networks:
      - clawd

volumes:
  rabbitmq_data:
  uploads:

networks:
  clawd:
    external: true
