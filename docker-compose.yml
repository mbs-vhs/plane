# Plane on clawd substrate
# - Removed: plane-db (use clawd-postgres), plane-redis (use clawd-redis), plane-minio (option A: no S3)
# - Kept bundled: plane-mq (RabbitMQ — no shared one to reuse)
# - Network: external `clawd` (joins clawd-postgres/clawd-redis directly by service name)

services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
    networks:
      - clawd

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web
    networks:
      - clawd

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web
    networks:
      - clawd

  api:
    container_name: api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-mq
    networks:
      - clawd

  worker:
    container_name: bgworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-mq
    networks:
      - clawd

  beat-worker:
    container_name: beatworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-mq
    networks:
      - clawd

  migrator:
    container_name: plane-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-mq
    networks:
      - clawd

  live:
    container_name: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - ./apps/api/.env
    networks:
      - clawd

  plane-mq:
    container_name: plane-mq
    # 2026-06-03 (CLAWD-1095): 3.13.6 → 3.13.7 (final EOL-line build) → 4.3.1
    # same night. 4.x preflight verified: all stable feature flags enabled,
    # khepri_db disabled (Mnesia default retained), zero policies (no classic
    # mirroring), plain classic celery queues. Volume backed up pre-jump
    # (~/.local/share/backups/plane-rabbitmq-pre-4.x-*). In-place 4.x→3.13
    # downgrade is NOT possible — rollback = restore volume + old tag.
    # 2026-06-22 stack-audit (CLAWD-1787): 4.3.1 -> 4.3.2 patch. Stays in 4.3.x —
    # NO Khepri/metadata-store door crossed; the transient_nonexcl_queues permit
    # (below) is unchanged + still required. Mgmt-plugin CORS/error-leak hardening,
    # no CVE. Vol + defs backed up: plane-rabbitmq-vol-pre-4.3.2-*, -defs-pre-4.3.2-*.
    # Rollback: restore volume + tag 4.3.1.
    image: rabbitmq:4.3.2-management-alpine
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # 4.x denies celery's transient pidbox/event queue declarations by
      # default — this permit keeps Plane workers functional (see file).
      - ./rabbitmq/20-permit-transient.conf:/etc/rabbitmq/conf.d/20-permit-transient.conf:ro
    networks:
      - clawd

  # plane-minio RETIRED 2026-06-09 (CLAWD-1096): Plane's object store cut over to
  # clawd-garage (MinIO CE was EOL/unpatchable — GHSA-jjjj-jwhf-8rgr never patched
  # in any published image; upstream archived 2026-04). Read+write verified on
  # garage via Plane's real presigned flow. The `uploads` named volume is KEPT as
  # a cold backup of the pre-cutover bytes (also mirrored into the garage `uploads`
  # bucket). Garage config lives in apps/api/.env + the proxy /uploads upstream.

  proxy:
    container_name: proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports:
      # Fail-closed bind: Tailscale-only posture per CONTEXT.md; operator sets LISTEN_BIND_IP=<tailscale-ip> in .env.
      - "${LISTEN_BIND_IP:-127.0.0.1}:${LISTEN_HTTP_PORT}:80"
    environment:
      SITE_ADDRESS: ":80"
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      # No upstream proxy in this topology; loopback-only fail-closed default. Operator can override via .env if a real upstream is added.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    depends_on:
      - web
      - api
      - space
      - admin
    networks:
      - clawd

volumes:
  rabbitmq_data:
  uploads:

networks:
  clawd:
    external: true
