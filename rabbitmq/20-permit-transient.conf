# Celery (Plane's worker framework) declares transient non-exclusive queues
# (pidbox remote-control + celeryev event queues). RabbitMQ 4.x denies the
# deprecated `transient_nonexcl_queues` feature by default -> kombu
# Queue.declare fails with 541 INTERNAL_ERROR and workers loop on reconnect
# (observed live 2026-06-03, CLAWD-1095). Permit it until celery/kombu move
# to quorum/exclusive declarations. Revisit before RabbitMQ 5.x (feature
# slated for hard removal).
deprecated_features.permit.transient_nonexcl_queues = true
